name: Secure Thoughtbox release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, for example 1.0.0-beta.1
        required: true
        type: string
      build_number:
        description: Monotonically increasing integer build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thoughtbox-secure-release
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: macos-15
    steps:
      - name: Require the protected main branch
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/main"

  build-sign-notarize:
    needs: verify-source
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build_number }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      THOUGHTBOX_DOWNLOAD_URL_PREFIX: https://github.com/guillermo-rebolledo/scratchpad/releases/download/thoughtbox-v${{ inputs.version }}/
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Import protected release credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -eu
          credential_directory="$RUNNER_TEMP/thoughtbox-release-credentials"
          mkdir -p "$credential_directory"
          chmod 700 "$credential_directory"
          keychain_path="$credential_directory/release.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "THOUGHTBOX_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$credential_directory/developer-id.p12"
          printf '%s' "$NOTARY_PRIVATE_KEY" > "$credential_directory/notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$credential_directory/sparkle-private-key"
          chmod 600 "$credential_directory"/*
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$credential_directory/developer-id.p12" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          {
            echo "NOTARY_KEY_PATH=$credential_directory/notary.p8"
            echo "SPARKLE_PRIVATE_KEY_PATH=$credential_directory/sparkle-private-key"
          } >> "$GITHUB_ENV"

      - name: Resolve pinned dependencies
        run: |
          set -eu
          package_directory="$RUNNER_TEMP/ThoughtboxSourcePackages"
          xcodebuild -resolvePackageDependencies \
            -project Thoughtbox.xcodeproj \
            -scheme Thoughtbox \
            -clonedSourcePackagesDirPath "$package_directory"
          echo "XCODE_CLONED_SOURCE_PACKAGES_DIRECTORY=$package_directory" >> "$GITHUB_ENV"
          sparkle_tools_directory="$(find "$package_directory/artifacts" -type d -path '*/Sparkle/bin' -print -quit)"
          test -x "$sparkle_tools_directory/generate_appcast"
          echo "SPARKLE_TOOLS_DIRECTORY=$sparkle_tools_directory" >> "$GITHUB_ENV"

      - name: Test behavior and durable data compatibility
        run: |
          Scripts/release/test-release-scripts.sh
          swift test --disable-automatic-resolution

      - name: Build, sign, notarize, staple, and sign update
        run: Scripts/release/build-and-notarize.sh

      - name: Exercise a signed Sparkle install and relaunch
        env:
          THOUGHTBOX_ALLOW_LOCAL_UPDATE_TEST: "1"
        run: Scripts/release/verify-local-update-pipeline.sh

      - name: Retain verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Thoughtbox-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            .build/release/channel/Thoughtbox-${{ inputs.version }}.zip
            .build/release/channel/appcast.xml
            .build/release/notary.json
            .build/release/source-commit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral credentials
        if: always()
        run: |
          set -eu
          if [ -n "${THOUGHTBOX_RELEASE_KEYCHAIN:-}" ] && [ -f "$THOUGHTBOX_RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$THOUGHTBOX_RELEASE_KEYCHAIN"
          fi
          credential_directory="$RUNNER_TEMP/thoughtbox-release-credentials"
          if [ -d "$credential_directory" ]; then
            find "$credential_directory" -type f -exec chmod u+w {} \;
            rm -rf "$credential_directory"
          fi
